<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Club Board</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: Arial, sans-serif; color: #222; line-height: 1.6; }

        header, footer { padding: 20px; }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 25px; background-color: black;}
        .logo { font-size: 24px; font-weight: bold; color: white;}
        nav { display: flex; flex-wrap: wrap; gap: 8px 25px; }
        nav a { color: inherit; text-decoration: none; }
        nav a:hover { opacity: 0.7; }
        .navbutton {color: white}

        .hero { text-align: center; padding: 60px 20px 30px; }
        .hero h1 { font-size: clamp(30px, 8vw, 48px); line-height: 1.2; margin-bottom: 15px; }
        .hero p { max-width: 560px; margin: auto; }
        hr {border: none; height: 5px; background-color: black; width: 85%; margin: auto;}

        section { max-width: 800px; margin: auto; padding: 40px 20px 80px; }

        .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
        button {
            padding: 6px 14px;
            border: 1px solid #222;
            border-radius: 5px;
            background: #fff;
            font: inherit;
            cursor: pointer;
        }
        button.active { background: #222; color: #fff; }
        button:focus-visible, nav a:focus-visible { outline: 2px solid #06c; outline-offset: 2px; }

        .post { border-top: 1px solid #ddd; padding: 20px 0; }
        .post small { color: #666; }
        .post h3 { margin: 4px 0; }

        footer { text-align: center; background: #222; color: white; background-color: black;}
    </style>
</head>

<body>

    <header>
        <div class="logo">Club Board</div>
        <nav>
            <a class = "navbutton" href="#home">Home</a>
        </nav>
    </header>

    <main>
        <div class="hero" id="home">
            <h1>All your club news in one place</h1>
            <p>Find the latest announcements from every club at our school. Pick a club below to see only its updates.</p>
        </div>

<hr>

        <section id="announcements">
            <div class="filters" id="filters"></div>
            <div id="posts"></div>
        </section>
    </main>

    <footer>
        <p>Club Board &middot; Helsingin Suomalainen Yhteiskoulu</p>
    </footer>

    <script>
        const clubs = ["All", "Chess Club", "Economics Club", "Math Club", "Law Club", "Medicine Club", "Robotics Club"];

        const announcements = [ { club: "Chess Club", date: "10/5/2026", title: "sample", text: "sample" } ];

        const filters = document.getElementById("filters");
        const posts   = document.getElementById("posts");
        let current   = "null";

        function show() {
            filters.innerHTML = "";
            clubs.forEach(name => {
                const b = document.createElement("button");
                b.textContent = name;
                if (name === current) b.className = "active";
                b.onclick = () => { current = name; show(); };
                filters.appendChild(b);
            });

            posts.innerHTML = "";
            const list = announcements.filter(a => current === "All" || a.club === current);
            
            if (!list.length) {
                posts.textContent = "No announcements yet.";
                return;
            }

            list.forEach(a => {
                const d = document.createElement("div");
                d.className = "post";
                
                const meta = document.createElement("small");
                meta.textContent = `${a.club} \u00b7 ${a.date}`;
                
                const title = document.createElement("h3");
                title.textContent = a.title;
                
                const body = document.createElement("p");
                body.textContent = a.text;

                d.append(meta, title, body);
                posts.appendChild(d);
            });
        }

        show();
    </script>

</body>
</html>

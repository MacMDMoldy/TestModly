<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Club Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">Club Board</div>
        <nav>
            <a class="navbutton" href="#home">Home</a>
        </nav>
    </header>

    <main>
        <div class="hero" id="home">
            <h1>All your club news in one place</h1>
            <p>Find the latest announcements from every club at our school. Pick a club below to see only its updates.</p>
        </div>

        <hr>

        <section id="announcements">
            <div id="root"></div>
        </section>
    </main>

    <footer>
        <p>Club Board &middot; Helsingin Suomalainen Yhteiskoulu</p>
    </footer>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


    <script type="text/babel" src="api.js"></script>
    <script type="text/babel" src="javasc.js"></script>
</body>
</html>
